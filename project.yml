name: Copia
options:
  developmentLanguage: fr
  bundleIdPrefix: com.thibault
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: PG46BWSK3T
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  Copia:
    type: application
    platform: macOS
    sources:
      - path: Sources/Copia
    info:
      path: Sources/Copia/Info.plist
      properties:
        CFBundleDisplayName: Copia
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copia — version personnelle"
        NSAccessibilityUsageDescription: "Copia colle le texte choisi à l'endroit de votre curseur."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.copia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
  CopiaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CopiaTests
      - path: Sources/Copia/Core/FuzzySearch.swift
      - path: Sources/Copia/Core/DedupEngine.swift
      - path: Sources/Copia/Core/ContentClassifier.swift
      - path: Sources/Copia/Core/ClipItem.swift
      - path: Sources/Copia/Core/FormaLink.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thibault.copia.tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Copia:
    build:
      targets:
        Copia: all
    test:
      targets: [CopiaTests]
